<title>看護師国試 徹底マスター</title>
<style>
:root{

  --main:#0f766e;--main2:#115e59;--soft:#e6f4f2;
  --ok:#15803d;--okbg:#e8f6ec;--ng:#c2410c;--ngbg:#fdeee6;--warn:#b45309;--warnbg:#fef5e4;
  --pred:#6d28d9;--predbg:#f1ebfd;--blue:#1d4ed8;--bluebg:#e8eefc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
@media (min-width:760px){
  .wrap{max-width:980px;padding-left:28px;padding-right:28px}
  body{font-size:17px}
  .qtext{font-size:19px}.ch{font-size:17px;padding:15px 18px}.case{font-size:16px}
  .res p,.point,.cmp .tx,.flow .nd{font-size:16px}
  #app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .tabbar button{font-size:12px;max-width:170px}
}
header.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
header.top h1{font-size:18px;font-weight:900}
header.top h1 span{color:var(--main)}
.sync{font-size:11px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.h2{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 8px;letter-spacing:.04em}
.count{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.count b{font-size:34px;font-weight:900;line-height:1}
.count small{display:block;font-size:12px;opacity:.85}
.count .r{margin-left:auto;text-align:right;font-size:12px}
.count .r b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--main)}
.stat b.bad{color:var(--ng)}
.stat small{font-size:11px;color:var(--sub)}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn .ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;font-weight:900;color:#fff}
.btn .tx{min-width:0}
.btn .tx b{display:block;font-size:15px}
.btn .tx small{font-size:12px;color:var(--sub)}
.btn .badge{margin-left:auto;font-size:12px;font-weight:700;background:var(--soft);color:var(--main2);padding:2px 9px;border-radius:99px;white-space:nowrap}
.btn.hero{background:var(--main);border-color:var(--main);color:#fff}
.btn.hero small{color:#cfece8}.btn.hero .ic{background:rgba(255,255,255,.18)}
.btn.hero .badge{background:#fff;color:var(--main2)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:4px}
.lv1{background:var(--okbg);color:var(--ok)}.lv2{background:var(--bluebg);color:var(--blue)}.lv3{background:var(--ngbg);color:var(--ng)}
.p-h{background:#fff3c4;color:#8a5a00}.p-k{background:var(--main);color:#fff}.p-pred{background:var(--predbg);color:var(--pred)}.p-ai{background:var(--warnbg);color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.step{border-radius:12px;padding:10px;text-align:center;border:1.5px solid var(--line);background:#fff}
.step b{display:block;font-size:13px}
.step small{font-size:11px;color:var(--sub)}
.step.cur{border-color:var(--main);background:var(--soft)}
.step.done b::after{content:" ✓";color:var(--ok)}
.catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .nm{flex:1;font-size:14px;min-width:0}
.catrow .nm small{display:block;font-size:11px;color:var(--sub)}
.bar{height:6px;background:#eef1f0;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--main)}
.bar i.low{background:var(--ng)}.bar i.mid{background:var(--warn)}
.tog{flex:none;font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--sub);padding:5px 10px;border-radius:99px;cursor:pointer}
.tog.on{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.go{flex:none;font:inherit;font-size:12px;font-weight:700;border:0;background:var(--soft);color:var(--main2);padding:6px 10px;border-radius:99px;cursor:pointer}
.go:disabled{opacity:.4}
/* quiz */
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--sub)}
.qhead .x{margin-left:auto;font:inherit;border:0;background:none;color:var(--sub);font-size:13px;cursor:pointer;padding:4px}
.prog{height:5px;background:#e3e9e7;border-radius:9px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--main);transition:width .3s}
.case{background:#f7faf9;border:1px solid var(--line);border-left:4px solid var(--main);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;white-space:pre-wrap}
.case b{display:block;font-size:12px;color:var(--main2)}
.qtext{font-size:16.5px;font-weight:500;margin:4px 0 14px;white-space:pre-wrap}
.ch{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:15px;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.ch .n{flex:none;width:24px;height:24px;border-radius:50%;background:#eef1f0;display:grid;place-items:center;font-size:12px;font-weight:700}
.ch.sel{border-color:var(--main);background:var(--soft)}.ch.sel .n{background:var(--main);color:#fff}
.ch.ok{border-color:var(--ok);background:var(--okbg)}.ch.ok .n{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}.ch.ng .n{background:var(--ng);color:#fff}
.ch:disabled{cursor:default}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--main2)}
.res{border-radius:14px;padding:14px 16px;margin-top:6px}
.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res h3{font-size:16px;margin-bottom:6px}
.res.ok h3{color:var(--ok)}.res.ng h3{color:var(--ng)}
.res p{font-size:14px}
.point{margin-top:10px;background:#fff;border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:14px}
.point b{color:var(--warn);font-size:12px;display:block}
.streak{display:flex;gap:5px;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.streak i{width:22px;height:8px;border-radius:9px;background:#dfe5e3}
.streak i.on{background:var(--ok)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act{flex:1;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:13px;cursor:pointer;background:var(--main);color:#fff}
.act:disabled{opacity:.45}
.act.sub{background:#fff;color:var(--main2);border:1.5px solid var(--line);flex:none;padding:12px 13px;font-size:13px}
.act.sub.on{background:var(--soft);border-color:var(--main)}
/* 図解 */
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.fig .ft{font-size:12px;font-weight:700;color:var(--main2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fig .ft::before{content:"図解";background:var(--main);color:#fff;font-size:10px;padding:1px 6px;border-radius:5px}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.flow .nd{background:var(--soft);border:1.5px solid #b9ddd8;border-radius:10px;padding:7px 10px;font-size:14px;text-align:center;font-weight:500}
.flow .ar{text-align:center;color:var(--main);font-size:14px;line-height:1.3}
.cmp .rw{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.cmp .lb{flex:none;width:34%;background:var(--bluebg);color:var(--blue);font-weight:700;font-size:13px;border-radius:8px;padding:7px 8px;display:flex;align-items:center}
.cmp .tx{flex:1;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.cmp .rw.hl .lb{background:var(--ok);color:#fff}
.cmp .rw.hl .tx{border-color:var(--ok);background:var(--okbg)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vs div{border-radius:10px;padding:9px 10px;font-size:13.5px}
.vs .y{background:var(--ngbg);border:1.5px solid #f3c5ab}
.vs .c{background:var(--okbg);border:1.5px solid #b6e0c2}
.vs small{display:block;font-weight:700;font-size:11px}
.vs .y small{color:var(--ng)}.vs .c small{color:var(--ok)}
.why{margin-top:8px;font-size:13.5px}
.why div{padding:6px 0;border-bottom:1px dashed var(--line)}
.why div:last-child{border:0}
.why b{color:var(--ng)}
.why b.okc{color:var(--ok)}
.ai-out{margin-top:10px;background:#fff;border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:18px 8px}
.big{font-size:40px;font-weight:900;color:var(--main);text-align:center}
.judge{font-size:20px;font-weight:900;text-align:center;margin:6px 0}
.judge.ok{color:var(--ok)}.judge.mid{color:var(--warn)}.judge.ng{color:var(--ng)}
.center{text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.list-q{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-q:last-child{border:0}
.mark{font-weight:700}.mark.ok{color:var(--ok)}.mark.ng{color:var(--ng)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar button{flex:1;max-width:140px;font:inherit;font-size:10.5px;font-weight:700;border:0;background:none;color:var(--sub);padding:8px 0 9px;cursor:pointer}
.tabbar button b{display:block;font-size:18px;line-height:1.2}
.tabbar button.on{color:var(--main)}
select{font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
.row{display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.switch input{width:20px;height:20px;accent-color:var(--main)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--main);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .card{max-width:380px;width:100%}
.exam{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exam:last-child{border:0}
.exam .nm{flex:1;font-size:14px}
.exam .nm small{display:block;font-size:11px;color:var(--sub)}
a.lnk{color:var(--main2);font-size:12px;font-weight:700}
.secbtns{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>

ZC("D",CT_D,"home","長女が利用できる制度として適切なのはどれか。",["育児休業","介護休業","傷病手当金","障害年金"],[1],"育児・介護休業法の介護休業は、要介護状態の対象家族1人につき通算93日まで、3回まで分割して取得できる。介護休暇（年5日、対象家族2人以上は10日）もある。","介護休業＝対象家族1人につき通算93日・3回まで分割"),
/* ---------- 看護の統合と実践 ---------- */
Z("int",1,1,"災害発生直後から数日間（超急性期・急性期）に優先される看護活動はどれか。",["避難所での慢性疾患の管理","トリアージと救命処置","仮設住宅での孤立予防","長期的な心のケア"],[1],"超急性期・急性期は救命が最優先で、トリアージ、救命処置、搬送が中心となる。亜急性期以降に避難所での健康管理、慢性期・復興期に仮設住宅での孤立予防や長期的な心のケアが重要になる。","災害急性期＝救命・トリアージ",{k:"flow",t:"災害サイクルと看護",s:["超急性期・急性期：救命・トリアージ・搬送","亜急性期：避難所の健康管理・感染予防","慢性期・復興期：仮設住宅での孤立予防・心のケア","静穏期：防災訓練・備え"]}),
Z("int",1,0,"DMATの説明として正しいのはどれか。",["災害急性期に活動する災害派遣医療チーム","災害派遣精神医療チーム","避難所を運営する行政チーム","海外で活動する国際緊急援助隊"],[0],"DMAT（Disaster Medical Assistance Team）は、災害急性期（おおむね48時間以内）から活動できる専門的な訓練を受けた医療チーム。精神医療を担うのはDPAT。","DMAT＝急性期の医療チーム／DPAT＝精神医療チーム"),
Z("int",2,0,"避難生活で長時間の車中泊を続ける被災者に起こりやすいのはどれか。",["深部静脈血栓症","熱傷","骨粗鬆症","白内障"],[0],"狭い車内で長時間同じ姿勢をとり、水分摂取も不足しがちになるため、深部静脈血栓症（いわゆるエコノミークラス症候群）から肺塞栓症を起こす危険がある。足の運動や水分摂取を促す。","車中泊＝深部静脈血栓症→肺塞栓に注意"),
Z("int",1,1,"患者誤認を防ぐための確認方法で最も適切なのはどれか。",["病室とベッドの番号で確認する","「〇〇さんですね」と看護師が名前を言って尋ねる","患者自身にフルネームを名乗ってもらう","顔を覚えているので確認を省く"],[2],"患者に氏名（必要に応じて生年月日）を名乗ってもらい、リストバンドと照合する。看護師が名前を言って尋ねると、聞き違いや思い込みで「はい」と答えることがあるため不十分。","患者確認＝本人に名乗ってもらう＋リストバンド照合"),
Z("int",2,0,"入院から退院まで、1人の看護師が受け持ち患者の看護に一貫して責任をもつ看護方式はどれか。",["機能別看護","プライマリナーシング","チームナーシング","固定チームナーシング"],[1],"プライマリナーシングは、1人の看護師が入院から退院まで受け持ち患者の看護計画と実践に責任をもつ方式。機能別看護は検温・処置など業務ごとに分担する方式、チームナーシングはチームで複数の患者を受け持つ方式。","プライマリナーシング＝1人の看護師が一貫して責任"),
Z("int",2,0,"すべての人が適切な保健医療サービスを、支払い可能な費用で受けられる状態を表すのはどれか。",["ユニバーサル・ヘルス・カバレッジ（UHC）","ヘルスプロモーション","ノーマライゼーション","インフォームド・コンセント"],[0],"ユニバーサル・ヘルス・カバレッジ（UHC）は、すべての人が経済的な困難なく必要な保健医療サービスを受けられることを目指す考え方で、持続可能な開発目標（SDGs）にも位置づけられている。","UHC＝誰もが費用の心配なく医療を受けられる"),
Z("int",1,0,"日本語を話せない外国人患者に病状を説明するときの対応で適切なのはどれか。",["付き添いの子どもに通訳してもらう","医療通訳を活用する","大きな声でゆっくり日本語で話す","説明を省略する"],[1],"正確な情報伝達とプライバシー保護のため、医療通訳や翻訳ツールを活用する。家族、特に子どもに医療情報の通訳を任せると、誤訳や心理的負担、プライバシーの問題が生じる。","外国人患者＝医療通訳を活用"),
Z("int",2,0,"ハインリッヒの法則で、1件の重大事故の背後にあるとされる軽微な事故の件数はどれか。",["10件","29件","100件","300件"],[1],"ハインリッヒの法則では、1件の重大事故の背後に29件の軽微な事故と300件のヒヤリ・ハットがあるとされる。ヒヤリ・ハットを報告し対策することが重大事故の予防につながる。","ハインリッヒ＝1：29：300"),
Z("int",2,0,"医療ソーシャルワーカー（MSW）の役割はどれか。",["与薬の管理","経済的・社会的な問題の相談援助","リハビリテーションの実施","栄養指導"],[1],"医療ソーシャルワーカーは、医療費や生活費などの経済的問題、退院後の生活や社会資源の活用など、患者・家族の社会的な問題について相談援助を行う。","MSW＝経済的・社会的問題の相談、退院支援"),
Z("int",3,0,"夜勤中、同時に次の4人から呼ばれた。最も優先して対応するのはどれか。",["術後1日目で呼吸が苦しいと訴え、SpO2 88%の患者","眠れないと訴える患者","点滴の残りが約1時間分の患者","見守りがあれば歩けるトイレ希望の患者"],[0],"生命に直結する呼吸の異常（気道・呼吸・循環＝ABC）を最優先する。術後の低酸素は無気肺や肺塞栓の可能性もあり、ただちに観察と対応が必要。","優先順位＝A（気道）B（呼吸）C（循環）の異常が最優先"),
Z("int",1,1,"家族を名乗る人から電話で入院患者の病状を尋ねられた。対応として適切なのはどれか。",["家族と言っているので病状を伝える","本人の同意と相手の確認ができるまで病状は伝えない","入院していることだけは伝える","主治医の携帯電話番号を教える"],[1],"電話では相手が本人の家族か確認できないため、患者本人の同意と相手の確認ができるまで、入院の有無も含めて個人情報を伝えない。","電話での問い合わせ＝本人同意の確認まで答えない"),
/* ---------- 老年看護学 ---------- */
Z("ger",1,1,"加齢に伴う身体の変化として正しいのはどれか。",["残気量の減少","肺活量の低下","胃酸分泌の増加","膀胱容量の増加"],[1],"加齢により肺の弾性や呼吸筋力が低下し、肺活量は低下、残気量は増加する。胃酸分泌は低下し、膀胱容量は減少して頻尿になりやすい。","加齢＝肺活量↓・残気量↑・膀胱容量↓"),
Z("ger",1,0,"高齢者の体温の特徴として正しいのはどれか。",["成人より体温が高い","感染症でも高い熱が出にくい","日内変動が大きくなる","発汗量が増える"],[1],"高齢者は基礎代謝や体温調節機能が低下し、平熱が低めで、肺炎などの感染症でも高熱が出にくい。発熱がなくても食欲低下や活気のなさなど、いつもと違う様子に注意する。","高齢者＝熱が出にくい→いつもと違う様子に注意"),
Z("ger",1,1,"認知症の中核症状はどれか。",["徘徊","見当識障害","物盗られ妄想","暴言"],[1],"中核症状は脳の障害で直接起こる症状で、記憶障害、見当識障害、実行機能障害、失語・失認・失行など。徘徊・妄想・暴言・不安などは環境や心理状態が影響して起こる行動・心理症状（BPSD）。","中核症状＝記憶・見当識・実行機能の障害／BPSD＝徘徊・妄想など",{k:"cmp",t:"認知症の症状",r:[["中核症状","記憶障害・見当識障害・実行機能障害・失語・失認・失行"],["BPSD（行動・心理症状）","徘徊・妄想・暴言・暴力・不安・抑うつ・睡眠障害"]],hl:0}),
Z("ger",2,0,"「財布を盗まれた」と訴える認知症の人への対応で適切なのはどれか。",["盗まれていないと説明して納得してもらう","否定せずに一緒に探す","家族に財布を預けるよう強く説得する","訴えを聞き流す"],[1],"物盗られ妄想に対しては否定や説得をせず、本人の不安な気持ちを受け止めて一緒に探し、本人が見つけられるように配慮する。否定すると不安や不信感が強まる。","物盗られ妄想＝否定せず一緒に探す"),
Z("ger",2,0,"改訂長谷川式簡易知能評価スケール（HDS-R）で認知症が疑われる得点はどれか。",["10点以下","20点以下","25点以下","28点以下"],[1],"HDS-Rは30点満点で、20点以下で認知症の疑いがあるとされる。MMSEは30点満点で23点以下が認知症の疑い。いずれもスクリーニング検査で、診断は医師が総合的に行う。","HDS-R＝20点以下／MMSE＝23点以下で認知症疑い"),
Z("ger",1,0,"高齢者の転倒予防のための住環境で適切なのはどれか。",["床に敷物を重ねて敷く","夜間は足元灯をつける","よく使う物を高い棚に置く","スリッパを履く"],[1],"夜間のトイレ移動時に転倒しやすいため足元灯をつける。敷物の段差やめくれ、脱げやすいスリッパ、高い所の物を取る動作は転倒の原因になる。","転倒予防＝足元灯・段差解消・かかとのある靴"),
Z("ger",2,0,"廃用症候群で起こるのはどれか。",["起立性低血圧","筋肥大","骨密度の増加","心肺機能の向上"],[0],"長期臥床などによる廃用症候群では、筋萎縮、関節拘縮、骨萎縮（骨密度低下）、起立性低血圧、心肺機能低下、褥瘡、意欲低下などが起こる。早期離床と活動で予防する。","廃用症候群＝筋萎縮・拘縮・起立性低血圧・褥瘡"),
Z("ger",2,0,"高齢者に薬物の有害事象が起こりやすい理由で正しいのはどれか。",["腎臓からの排泄能力が低下する","体内の水分量が増える","肝臓の代謝能力が高まる","胃からの吸収が速くなる"],[0],"加齢により腎機能（排泄）と肝機能（代謝）が低下し、薬が体内に長くとどまって血中濃度が上がりやすい。体内水分量は減少する。多剤併用（ポリファーマシー）も有害事象の原因になる。","高齢者＝腎排泄↓・肝代謝↓→薬が効きすぎやすい"),
Z("ger",1,0,"エリクソンの発達段階で、老年期の発達課題はどれか。",["生殖性 対 停滞","統合 対 絶望","親密性 対 孤立","勤勉性 対 劣等感"],[1],"エリクソンは老年期の課題を「統合 対 絶望」とし、自分の人生を振り返って受け入れることで英知を得るとした。生殖性対停滞は成人期（壮年期）、親密性対孤立は成人前期（若年成人期）。","老年期＝統合 対 絶望"),
Z("ger",2,0,"養護者による高齢者虐待で、最も多い種別はどれか。",["身体的虐待","性的虐待","経済的虐待","介護等放棄（ネグレクト）"],[0],"厚生労働省の調査では、養護者による高齢者虐待で最も多いのは身体的虐待で、次いで心理的虐待、介護等放棄、経済的虐待の順に多い。","養護者による高齢者虐待＝身体的虐待が最多"),
ZC("E",CT_E,"ger","Eさんの状態として最も考えられるのはどれか。",["せん妄","うつ病","認知症の急激な進行","正常な反応"],[0],"入院や肺炎をきっかけに急に発症し、夜間に悪化して日中はうとうとするなど症状が1日の中で変動する。これはせん妄の特徴である。認知症の人や高齢者は起こしやすい。","せん妄＝急な発症・日内変動（夜間に悪化）・注意障害"),
ZC("E",CT_E,"ger","Eさんへの対応で適切なのはどれか。",["すぐに身体拘束を行う","日中は離床を促し、昼夜のリズムを整える","部屋を一日中暗くしておく","家族の面会を制限する"],[1],"せん妄は、日中の覚醒と活動、日光を浴びる、カレンダーや時計で見当識を補う、家族の面会など、安心できる環境と生活リズムを整えて予防・改善を図る。身体拘束は最後の手段で、せん妄を悪化させることもある。","せん妄のケア＝生活リズム・見当識の支援・安心できる環境"),
/* ---------- 精神看護学 ---------- */
Z("psy",1,1,"うつ病でみられる症状はどれか。",["早朝覚醒","多弁","誇大妄想","観念奔逸"],[0],"うつ病では抑うつ気分、興味・喜びの喪失、早朝覚醒などの睡眠障害、食欲低下、自責感、希死念慮などがみられる。多弁・誇大妄想・観念奔逸は躁状態の症状。","うつ＝早朝覚醒・日内変動（朝が悪い）／躁＝多弁・観念奔逸"),
Z("psy",1,0,"双極性障害の躁状態でみられる症状はどれか。",["観念奔逸","思考制止","早朝覚醒","罪業妄想"],[0],"躁状態では気分の高揚、観念奔逸（考えが次々と飛ぶ）、多弁、睡眠欲求の減少、誇大妄想、浪費などがみられる。思考制止や罪業妄想はうつ状態の症状。","躁＝観念奔逸・多弁・誇大妄想・浪費"),
Z("psy",1,1,"試験に落ちた学生が「問題が悪かったからだ」と考える防衛機制はどれか。",["抑圧","合理化","投影","昇華"],[1],"合理化は、失敗や受け入れがたい行動に、もっともらしい理由をつけて正当化する防衛機制。抑圧は不快な記憶を意識から締め出す、投影は自分の感情を他者のものとみなす、昇華は欲求を社会的に認められる形で表す。","合理化＝もっともらしい理由で正当化",{k:"cmp",t:"主な防衛機制",r:[["抑圧","受け入れがたい感情や記憶を無意識に押し込める"],["合理化","もっともらしい理由をつけて正当化する"],["投影","自分の感情を相手のものとみなす"],["昇華","欲求を社会的に認められる活動に向ける"],["退行","以前の発達段階の行動に戻る"]],hl:1}),
Z("psy",2,0,"アルコール依存症の人が飲酒をやめたあと、振戦せん妄が出現しやすい時期はどれか。",["数時間以内","2〜4日後","2週間後","1か月後"],[1],"離脱症状は、断酒後数時間〜1日程度で手のふるえ・発汗・不眠などの早期症状が出現し、2〜4日後（48〜96時間）ごろに幻視や意識障害を伴う振戦せん妄が出現しやすい。","振戦せん妄＝断酒後2〜4日ごろ"),
Z("psy",2,0,"抗精神病薬の重篤な副作用である悪性症候群の症状はどれか。",["高熱と筋強剛","低体温","多幸感","体重減少"],[0],"悪性症候群は抗精神病薬の投与や増量などで起こり、高熱、筋強剛、意識障害、発汗、頻脈、血清CK（クレアチンキナーゼ）の上昇がみられる。生命に関わるため早期発見が重要。","悪性症候群＝高熱・筋強剛・CK上昇"),
Z("psy",2,0,"精神科病院で身体的拘束を行うことを判断するのはどれか。",["看護師長","精神保健指定医","家族","病院の事務長"],[1],"精神保健福祉法に基づき、身体的拘束は精神保健指定医が必要と認めた場合に行う。行動制限は最小限とし、実施中は頻回の観察と記録を行う。","身体的拘束の判断＝精神保健指定医"),
Z("psy",1,0,"幻聴を訴える患者への対応として適切なのはどれか。",["幻聴は現実ではないと説得する","幻聴の内容を詳しく聞き出して肯定する","否定も肯定もせず、患者のつらさに共感する","幻聴の話題には一切触れない"],[2],"幻聴は本人にとっては現実の体験であり、否定すると信頼関係を損ない、肯定すると症状を強めるおそれがある。否定も肯定もせず、聞こえていることによる苦痛や不安に寄り添う。","幻聴＝否定も肯定もせず、つらさに共感"),
Z("psy",2,0,"選択的セロトニン再取り込み阻害薬（SSRI）の服用開始初期にみられやすい副作用はどれか。",["悪心などの消化器症状","高熱と筋強剛","血糖値の上昇","徐脈"],[0],"SSRIは服用開始初期に悪心などの消化器症状が出やすい。また開始初期や増量時には不安・焦燥が強まる賦活症候群に注意する。効果が出るまでに2週間程度かかることも説明する。","SSRI＝開始初期の悪心・賦活症候群に注意"),
Z("psy",1,0,"パニック障害の特徴はどれか。",["突然の動悸や息苦しさの発作と、また起こるのではという予期不安","特定の行為を繰り返さずにいられない","強い外傷体験のフラッシュバック","気分の高揚が続く"],[0],"パニック障害は、突然の動悸、息苦しさ、めまいなどのパニック発作を繰り返し、また発作が起こるのではないかという予期不安や、発作が起きたら逃げられない場所を避ける広場恐怖を伴う。","パニック障害＝パニック発作・予期不安・広場恐怖"),
Z("psy",2,0,"社会生活技能訓練（SST）の説明として正しいのはどれか。",["対人関係などの技能をロールプレイで練習する","薬物の効果を説明する","作品の制作を通して自己表現する","家族の問題を話し合う"],[0],"SSTは認知行動療法に基づき、あいさつや頼みごとの仕方など、社会生活に必要な対人技能をロールプレイで練習し、よい点を認めて強化していく方法。作品制作による自己表現は作業療法や芸術療法。","SST＝ロールプレイで対人技能を練習"),
ZC("F",CT_F,"psy","Fさんへの関わりで適切なのはどれか。",["悪口は聞こえないはずだと説得する","短時間でも訪室し、安心できる関わりを続ける","集団活動への参加を強く促す","食事を残したことを注意する"],[1],"幻聴による不安や被害感が強い時期は、短時間でも定期的に訪室し、そばにいて安心感を与えることで信頼関係を築く。説得、強い参加の要求、叱責は不安を強める。","急性期の統合失調症＝短時間でも頻回に関わり安心感を"),
ZC("F",CT_F,"psy","症状が安定し退院に向けて準備することになった。Fさんの地域生活を支える社会資源として適切なのはどれか。",["精神科デイケア","特別養護老人ホーム","介護老人保健施設","措置入院"],[0],"精神科デイケアは、日中に通所して生活リズムを整え、対人関係や生活技能の回復を図る場である。特別養護老人ホームや介護老人保健施設は主に高齢者の介護施設。","精神障害者の地域生活＝デイケア・訪問看護・就労支援など"),

Z("ped",1,1,"新生児の心拍数（正常）として最も近いのはどれか。",["60〜80回/分","80〜100回/分","120〜140回/分","180〜200回/分"],[2],"新生児の心拍数は120〜140回/分程度、呼吸数は40〜50回/分程度。年齢が上がるにつれて心拍数・呼吸数は少なくなる。","新生児＝心拍120〜140・呼吸40〜50"),
Z("ped",1,1,"新生児の呼吸の特徴として正しいのはどれか。",["胸式呼吸が中心である","腹式呼吸が中心である","呼吸数は成人より少ない","口呼吸が中心である"],[1],"新生児は肋骨が水平で呼吸筋が未発達なため腹式呼吸が中心で、主に鼻で呼吸する。呼吸数は40〜50回/分程度と成人より多い。","新生児＝腹式呼吸・鼻呼吸・呼吸数40〜50回/分"),
Z("ped",1,0,"体重が出生時の約2倍になる時期はどれか。",["生後1か月","生後3〜4か月","1歳","2歳"],[1],"体重は生後3〜4か月で出生時の約2倍、1歳で約3倍になる。身長は1歳で出生時の約1.5倍、4歳ごろに約2倍になる。","体重：3〜4か月で2倍・1歳で3倍／身長：1歳で1.5倍"),
Z("ped",1,1,"原始反射はどれか。",["モロー反射","パラシュート反射","立ち直り反射","腱反射"],[0],"原始反射は新生児期から乳児期早期にみられ、成長とともに消失する反射で、モロー反射、吸啜反射、把握反射などがある。パラシュート反射は生後9〜10か月ごろに出現する姿勢反射。","原始反射＝モロー・吸啜・把握（成長で消える）"),
Z("ped",1,0,"乳幼児突然死症候群（SIDS）の予防として適切なのはどれか。",["うつぶせに寝かせる","あおむけに寝かせる","厚い掛け布団を使う","そばでたばこを吸ってもよい"],[1],"SIDSの予防には、1歳まではあおむけに寝かせる、できるだけ母乳で育てる、保護者が喫煙しない（受動喫煙を避ける）ことが勧められている。","SIDS予防＝あおむけ寝・母乳・禁煙"),
Z("ped",2,0,"エリクソンの発達段階で、幼児前期（1〜3歳ごろ）の発達課題はどれか。",["基本的信頼 対 不信","自律性 対 恥・疑惑","自主性 対 罪悪感","勤勉性 対 劣等感"],[1],"乳児期は基本的信頼対不信、幼児前期は自律性対恥・疑惑、幼児後期（遊戯期）は自主性対罪悪感、学童期は勤勉性対劣等感、青年期は同一性対同一性の拡散。","乳児期：信頼／幼児前期：自律性／幼児後期：自主性／学童期：勤勉性",{k:"flow",t:"エリクソンの発達段階（子ども）",s:["乳児期：基本的信頼 対 不信","幼児前期：自律性 対 恥・疑惑","幼児後期：自主性 対 罪悪感","学童期：勤勉性 対 劣等感","青年期：同一性 対 同一性の拡散"]}),
Z("ped",2,0,"ピアジェの認知発達理論で、前操作期（2〜7歳ごろ）の特徴はどれか。",["アニミズム","抽象的な思考","保存の概念の獲得","仮説を立てて推論する"],[0],"前操作期は自己中心性やアニミズム（物にも命や心があると考える）が特徴。保存の概念は具体的操作期（7〜11歳ごろ）に獲得し、抽象的・仮説的な思考は形式的操作期（11歳ごろ〜）。","前操作期＝自己中心性・アニミズム"),
Z("ped",2,0,"入院した幼児にみられる分離不安の最初の段階はどれか。",["抗議","絶望","離脱（否認）","受容"],[0],"親から離された幼児の分離不安は、激しく泣いて親を求める「抗議」、無気力になる「絶望」、親に関心を示さなくなる「離脱（否認）」の順に進む。","分離不安＝抗議→絶望→離脱"),
Z("ped",2,0,"浮腫がみられるネフローゼ症候群の小児の食事で適切なのはどれか。",["塩分を制限する","水分を多くとる","炭水化物を制限する","高たんぱく食を徹底する"],[0],"浮腫が強い時期は塩分を制限し、必要に応じて水分も調整する。小児のネフローゼ症候群では成長に必要なエネルギーを確保し、過度のたんぱく制限は行わない。","小児ネフローゼの浮腫期＝塩分制限"),
ZC("G",CT_G,"ped","Gちゃんにとって安楽な体位はどれか。",["仰臥位","腹臥位","起座位","側臥位"],[2],"喘息発作時は上体を起こし前かがみになる起座位をとると、横隔膜が下がり呼吸補助筋も使いやすくなって呼吸が楽になる。抱っこやオーバーテーブルにもたれる姿勢も有効。","喘息発作＝起座位（上体を起こして前かがみ）"),
ZC("G",CT_G,"ped","Gちゃんが退院するときの母親への指導で適切なのはどれか。",["こまめに掃除をして、ダニやほこりを減らす","発作がない日は吸入ステロイド薬を中止する","運動はすべて禁止する","室内でペットを飼うことを勧める"],[0],"ダニ・ハウスダスト・たばこの煙・ペットの毛などの発作の誘因を減らす。長期管理薬（吸入ステロイド薬）は発作がなくても毎日続ける。運動は発作を予防しながら適度に行う。","小児喘息＝誘因を避ける・長期管理薬は毎日継続"),

Z("mat",1,1,"妊娠の診断（妊娠検査薬）に用いられるホルモンはどれか。",["ヒト絨毛性ゴナドトロピン（hCG）","エストロゲン","オキシトシン","プロラクチン"],[0],"hCGは受精卵の着床後に絨毛から分泌され、尿中のhCGを検出して妊娠を判定する。妊娠10週前後に分泌のピークを迎える。","妊娠検査＝尿中hCG"),
Z("mat",1,1,"最終月経の開始日が4月1日のとき、ネーゲレ概算法による分娩予定日はどれか。",["12月25日","1月8日","1月15日","2月1日"],[1],"ネーゲレ概算法では、最終月経開始日の月に9を足す（または3を引く）、日に7を足す。4月＋9＝13→翌年1月、1日＋7＝8日で、1月8日となる。","分娩予定日＝月＋9（−3）、日＋7"),
Z("mat",1,0,"射乳反射（乳汁の排出）に関わるホルモンはどれか。",["プロラクチン","オキシトシン","エストロゲン","プロゲステロン"],[1],"乳汁をつくるのはプロラクチン、乳汁を押し出す射乳反射や子宮収縮に関わるのはオキシトシン。どちらも児が乳頭を吸う刺激で分泌が促される。","プロラクチン＝乳汁をつくる／オキシトシン＝出す・子宮収縮",{k:"cmp",t:"授乳に関わるホルモン",r:[["プロラクチン","乳汁の産生（下垂体前葉）"],["オキシトシン","射乳反射・子宮収縮（下垂体後葉）"]],hl:1}),
Z("mat",2,0,"分娩第2期はどれか。",["陣痛開始から子宮口全開大まで","子宮口全開大から児の娩出まで","児の娩出から胎盤の娩出まで","胎盤娩出後2時間"],[1],"分娩第1期は陣痛開始から子宮口全開大まで、第2期は子宮口全開大から児娩出まで、第3期は児娩出から胎盤娩出まで。胎盤娩出後の2時間は分娩第4期とよばれ、出血に注意する。","第1期：〜全開大／第2期：〜児娩出／第3期：〜胎盤娩出",{k:"flow",t:"分娩の経過",s:["第1期：陣痛開始 → 子宮口全開大","第2期：子宮口全開大 → 児の娩出","第3期：児の娩出 → 胎盤の娩出","第4期：胎盤娩出後2時間（出血に注意）"]}),
Z("mat",2,0,"妊娠に伴う母体の生理的変化として正しいのはどれか。",["循環血液量が増加する","心拍数が減少する","腸の蠕動運動が亢進する","基礎体温が妊娠中ずっと低い"],[0],"妊娠中は循環血液量が約40〜50%増加し、心拍数も増える。血漿量の増加が赤血球の増加より大きいため水血症（生理的貧血）になりやすい。プロゲステロンの作用で腸の蠕動は低下し便秘になりやすい。","妊娠＝循環血液量↑・生理的貧血・便秘しやすい"),
Z("mat",2,0,"妊娠後期の妊婦が仰臥位で血圧低下と気分不快を訴えた。対応で適切なのはどれか。",["左側臥位にする","頭を低くして足を上げる","そのまま仰臥位で様子をみる","座位で前かがみにする"],[0],"仰臥位低血圧症候群は、大きくなった子宮が下大静脈を圧迫して静脈還流が減り、血圧が低下する状態。左側臥位にして圧迫を解除する。","仰臥位低血圧症候群＝左側臥位"),
Z("mat",1,0,"新生児のアプガースコアを評価する時期はどれか。",["出生直後のみ","生後1分と5分","生後1時間","生後24時間"],[1],"アプガースコアは生後1分と5分に、心拍数、呼吸、筋緊張、反射、皮膚色の5項目を0〜2点で評価する（10点満点）。","アプガースコア＝1分後と5分後・5項目10点満点"),
Z("mat",2,0,"生後24時間以内に出現した新生児の黄疸について正しいのはどれか。",["生理的黄疸である","病的黄疸を疑う","母乳性黄疸である","治療は不要である"],[1],"生理的黄疸は生後2〜3日ごろに出現し、1〜2週間で消える。生後24時間以内に出現する早発黄疸は、血液型不適合などによる病的黄疸を疑い、ビリルビン値の測定や光線療法を検討する。","生後24時間以内の黄疸＝病的黄疸を疑う"),
Z("mat",2,0,"妊娠したときの届出先はどれか。",["市町村","都道府県","保健所","勤務先"],[0],"母子保健法により、妊娠した人は市町村に妊娠の届出を行い、市町村は母子健康手帳を交付する。","妊娠の届出＝市町村→母子健康手帳の交付"),
Z("mat",2,0,"産褥期の子宮復古を促すのはどれか。",["早期からの授乳","膀胱に尿をためておく","ベッド上安静を続ける","授乳を控える"],[0],"授乳による乳頭への刺激でオキシトシンが分泌され子宮収縮が促される。早期離床や、膀胱・直腸を空にしておくことも子宮復古を助ける。膀胱が充満すると子宮収縮が妨げられる。","子宮復古を促す＝授乳・早期離床・排尿"),

Z("soc",1,1,"合計特殊出生率の説明として正しいのはどれか。",["15〜49歳の女性の年齢別出生率を合計したもの","人口1,000人あたりの出生数","1年間の出生数の総数","既婚女性が産んだ子どもの平均数"],[0],"合計特殊出生率は、15〜49歳の女性の年齢別出生率を合計したもので、1人の女性が一生の間に産む子どもの数の平均に相当する。人口1,000人あたりの出生数は出生率（粗出生率）。","合計特殊出生率＝15〜49歳女性の年齢別出生率の合計"),
Z("soc",1,1,"国民医療費の財源で最も割合が大きいのはどれか。",["保険料","公費","患者負担","その他"],[0],"国民医療費の財源は、保険料が約5割と最も多く、次いで公費（国・地方）が約4割、患者負担が約1割である。","国民医療費の財源＝保険料（約5割）＞公費＞患者負担"),
Z("soc",1,0,"受動喫煙の防止について定めている法律はどれか。",["健康増進法","地域保健法","医療法","学校保健安全法"],[0],"健康増進法は、国民の健康づくりの推進とともに受動喫煙の防止を定めており、多くの人が利用する施設での原則屋内禁煙などが規定されている。","受動喫煙の防止＝健康増進法"),
Z("soc",1,1,"医療法で「病院」と定められている病床数はどれか。",["10床以上","19床以上","20床以上","50床以上"],[2],"医療法では、20人以上の患者を入院させる施設を病院、入院施設がないか19人以下の施設を診療所としている。","病院＝20床以上／診療所＝19床以下"),
Z("soc",2,0,"生活保護制度で、医療を現物給付するのはどれか。",["生活扶助","医療扶助","住宅扶助","教育扶助"],[1],"生活保護には生活・教育・住宅・医療・介護・出産・生業・葬祭の8種類の扶助がある。医療扶助と介護扶助は原則として現物給付で、それ以外は原則として金銭給付。","生活保護＝8つの扶助・医療と介護は現物給付"),
Z("soc",1,0,"保健所を設置するのはどれか。",["都道府県","すべての市町村","国","社会福祉協議会"],[0],"地域保健法により、保健所は都道府県、指定都市、中核市、その他政令で定める市、特別区が設置する。市町村は住民に身近なサービスを行う市町村保健センターを設置できる。","保健所＝都道府県・指定都市・中核市など／保健センター＝市町村"),
Z("soc",2,0,"労働基準法で、出産予定の女性が請求すれば取得できる産前休業の期間はどれか。",["4週間","6週間","8週間","12週間"],[1],"産前休業は出産予定日の6週間前（多胎妊娠は14週間前）から、本人の請求により取得できる。産後8週間は原則として就業させてはならない（6週間経過後、本人が請求し医師が認めた業務は可）。","産前6週（多胎14週）・産後8週"),
Z("soc",2,0,"精神科の通院医療費の自己負担を軽くする制度はどれか。",["自立支援医療（精神通院医療）","高額療養費制度のみ","介護保険","労災保険"],[0],"障害者総合支援法の自立支援医療（精神通院医療）は、精神疾患で継続的に通院する人の医療費の自己負担を原則1割に軽減し、所得に応じた月額の上限を設ける制度である。","精神科通院＝自立支援医療で自己負担を軽減"),

Z("adult",1,1,"狭心症発作時のニトログリセリンの投与方法で正しいのはどれか。",["舌下投与","皮下注射","内服して水で飲み込む","筋肉内注射"],[0],"ニトログリセリン錠は舌下で溶かして口腔粘膜から吸収させると、速やかに効果が出る。飲み込むと肝臓で分解され効果が弱くなる。血圧低下に注意し、座って使用する。","ニトログリセリン＝舌下（座って使う）"),

const MASTER = 3, IVL=[0,1,3,7,14,30], DAY=86400000;
let S = {q:{},weak:[],gen:[],days:{},fx:{},mocks:[],kr:{},set:{auto:false,rate:1}};
let docRef=null, saveTimer=null;
function allQ(){ return BANK.concat(NEW,KAKO,S.gen||[]); }
let IDX={}; function reindex(){ IDX={}; allQ().forEach(x=>IDX[x.id]=x); }
function byId(id){ return IDX[id]; }
function st(id){ return S.q[id]||(S.q[id]={n:0,c:0,s:0,b:0,d:0,w:0}); }
function mastered(id){ const x=S.q[id]; return !!x && x.s>=MASTER; }
function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function merge(o){ S=Object.assign({q:{},weak:[],gen:[],days:{},fx:{},mocks:[],kr:{},set:{auto:false,rate:1}},o); if(!S.kr) S.kr={}; }
function loadLocal(){ try{ const t=localStorage.getItem("kokushi_v1"); if(t) merge(JSON.parse(t)); }catch(e){} }
function save(){
  // 図解キャッシュは直近80件まで
  const ks=Object.keys(S.fx); if(ks.length>80) ks.slice(0,ks.length-80).forEach(k=>delete S.fx[k]);
  try{ localStorage.setItem("kokushi_v1",JSON.stringify(S)); }catch(e){}
  scheduleSync();
  if(docRef){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{
    try{ await docRef.set({json:JSON.stringify(S),t:Date.now()}); setSync("クラウドに保存済み"); }catch(e){ setSync("端末に保存"); }
  },800); }
}

function rateOf(list){ let n=0,c=0; list.forEach(x=>{const s=S.q[x.id]; if(s){n+=s.n;c+=s.c;}}); return n?c/n:null; }
function catStat(cat){
  const qs=allQ().filter(x=>x.cat===cat); let n=0,c=0,m=0;
  qs.forEach(x=>{const s=S.q[x.id]; if(s){n+=s.n;c+=s.c;} if(mastered(x.id)) m++;});
  return {total:qs.length,n,c,m,rate:n?Math.round(c/n*100):null};
}
function lvStat(lv){ const qs=allQ().filter(x=>x.lv===lv); const m=qs.filter(x=>mastered(x.id)).length; return {total:qs.length,m,pct:qs.length?m/qs.length:0}; }
function curLevel(){ for(const lv of [1,2,3]){ if(lvStat(lv).pct<0.8) return lv; } return 3; }
function suggestedWeak(){ return Object.keys(CATS).filter(k=>{const s=catStat(k); return s.n>=3&&s.rate<70;}); }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function seenToday(x){ const s=S.q[x.id]; return !!(s&&s.t&&dayKey(s.t)===dayKey(Date.now())); }
function fresh(x){ return ready(x)&&!seenToday(x); }      // 今日出してよい問題
function dueList(){ return allQ().filter(x=>{const s=S.q[x.id]; return s&&s.n>0&&fresh(x);}).map(x=>x.id); }
function ready(x){ const s=S.q[x.id]; return !s||!s.n||s.d<=Date.now(); }   // マスター済みも長い間隔のあとに確認で出す
function nextDue(list){ const t=list.map(x=>S.q[x.id]).filter(s=>s&&s.n&&s.d>Date.now()).map(s=>s.d); return t.length?Math.min(...t):null; }
function dueText(t){ if(!t) return ""; const d=Math.max(1,Math.ceil((t-Date.now())/DAY)); return d+"日後"; }
function wrongList(){ return allQ().filter(x=>{const s=S.q[x.id]; return s&&s.w>0&&!mastered(x.id)&&s.s===0;}).map(x=>x.id); }   // 直近で間違えたまま
function weakPool(){ return allQ().filter(x=>S.weak.includes(x.cat)&&fresh(x)).map(x=>x.id); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sameSet(a,b){ if(a.length!==b.length) return false; const s=new Set(a); return b.every(x=>s.has(x)); }
// 事例(状況設定)はまとめて並べる
function groupCases(ids){
  const out=[], seen=new Set();
  ids.forEach(id=>{ const x=byId(id); if(!x||seen.has(id)) return;
    if(x.cs){ allQ().filter(y=>y.cs===x.cs&&ids.includes(y.id)).forEach(y=>{ if(!seen.has(y.id)){seen.add(y.id);out.push(y.id);} }); }
    else { seen.add(id); out.push(id); } });
  return out;
}

/* ===== 平均点・合格予測率 ===== */
const PASS_BORDER_GEN=158;   // 一般+状況の合格基準点（第111〜115回の平均 約158点/250点）
function srcRates(){
  const all=allQ(); let hc=0,hn=0,gc=0,gn=0;
  all.forEach(x=>{const s=S.q[x.id]; if(!s||!s.n) return; if(x.h){hc+=s.c;hn+=s.n;} else {gc+=s.c;gn+=s.n;}});
  Object.keys(S.kr||{}).forEach(id=>{const k=KR.find(x=>x.id===id), r=S.kr[id]; if(!k||!r) return; if(k.hissu){hc+=r.c;hn+=r.n;} else {gc+=r.c;gn+=r.n;}});
  return {hc,hn,gc,gn};
}
function avgScore(){ const r=srcRates(), n=r.hn+r.gn; return n?Math.round((r.hc+r.gc)/n*100):null; }
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2); const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function passPred(){
  const r=srcRates(); if(r.hn+r.gn<30) return null;           // 30問未満は判定しない
  // 解答数が少ないうちは受験生の平均的な正答率（必修75%・一般60%）に寄せて推定
  const k=8, ph=(r.hc+0.75*k)/(r.hn+k), pg=(r.gc+0.60*k)/(r.gn+k);
  // 必修：50問中40問以上（二項分布）
  let lc=1,ph40=0; for(let x=0;x<=50;x++){ if(x>0) lc=lc*(50-x+1)/x; if(x>=40) ph40+=lc*Math.pow(ph,x)*Math.pow(1-ph,50-x); }
  // 一般(130問×1点)+状況設定(60問×2点)＝250点：正規近似＋推定のばらつき
  const mean=250*pg, v=370*pg*(1-pg)+250*250*pg*(1-pg)/(r.gn+k), pgen=1-normCdf((PASS_BORDER_GEN-0.5-mean)/Math.sqrt(v));
  return {pass:Math.round(ph40*pgen*100), ph:Math.round(ph*100), pg:Math.round(pg*100), n:r.hn+r.gn};
}

    if(o&&typeof o.q==="string"&&Array.isArray(o.c)&&o.c.length>=4&&o.c.length<=5&&a&&a.length&&a.every(v=>Number.isInteger(v)&&v>=0&&v<o.c.length)){

    }});

let drillBusy=false;
async function drillSub(id){
  if(drillBusy) return;
  const x=KR.find(k=>k.id===id), rt=krRate(id);
  const have=(S.gen||[]).filter(g=>g.sub===id&&fresh(g)).map(g=>g.id);
  if(have.length>=5) return startQuiz(shuffle(have).slice(0,10),"特訓："+x.name,{drill:true});
  if(NOAI){ const p=allQ().filter(q=>q.cat===x.cat&&fresh(q)).sort((a,b)=>a.lv-b.lv||Math.random()-.5);
    const pool=(x.hissu?p.filter(q=>q.h):p); const use=(pool.length?pool:p);
    if(!use.length) return info(`「${CATS[x.cat]}」の今日の特訓は終わりです！正解した問題は日を空けてまた出題します。`);
    return startQuiz(groupCases(use.slice(0,10).map(q=>q.id)),"特訓："+CATS[x.cat],{drill:true}); }
  const lv=rt===null?1:rt<0.5?1:rt<0.8?2:3;   // 弱いほど基礎から
  drillBusy=true;
  const m=document.getElementById("modal"); document.getElementById("modalBody").innerHTML=`<p><span class="spin"></span> 「${esc(x.name)}」の${LV[lv]}問題をつくっています…</p>`; m.classList.add("on");
  try{ const ids=await genFor(x.cat,lv,x.hissu?"必修："+x.name:x.name,id); m.classList.remove("on"); drillBusy=false;
    if(!ids.length) return info("問題を作れませんでした。もう一度お試しください。");
    startQuiz(have.concat(ids),"特訓："+x.name,{drill:true});
  }catch(e){ drillBusy=false; m.classList.remove("on");
    const bank=allQ().filter(q=>q.cat===x.cat&&fresh(q)).map(q=>q.id);
    info((e&&e.code==="unavailable"?"この表示環境ではAI作問を使えません。":e&&e.code==="rate_limited"?"混み合っています。":"AI作問に失敗しました。")+(bank.length?`<br>代わりに「${CATS[x.cat]}」の収録問題で特訓します。`:""));
    if(bank.length) setTimeout(()=>startQuiz(groupCases(shuffle(bank).slice(0,8)),"特訓："+CATS[x.cat],{drill:true}),50);
  }
}

/* ============ 音声 ============ */
let tts, speaking=false;
async function getTTS(){ if(tts!==undefined) return tts; try{ tts=(window.claude&&window.claude.use)?await window.claude.use("tts"):null; if(tts) tts.onState(({state})=>{speaking=state==="speaking"||state==="paused"; updSpk();}); }catch(e){ tts=null; } return tts; }
function speechText(item){
  const fx=S.fx[item.id];
  const ans="正解は、"+item.a.map(i=>item.c[i]).join("と、")+"です。";
  const body=fx&&fx.talk?fx.talk:item.e;
  const fig=item.d||(fx&&fx.d); let ft="";
  if(fig&&fig.k==="flow") ft=" 流れで覚えましょう。"+fig.s.join("、そして、")+"。";
  if(fig&&fig.k==="cmp") ft=" 整理すると、"+fig.r.map(r=>r[0]+"は、"+r[1]).join("。")+"。";
  return (ans+body+ft+(item.p?" 覚えるポイント。"+item.p.replace(/[／/]/g,"。")+"。":"")).replace(/[＝=]/g,"は").replace(/→/g,"、").slice(0,1900);
}
async function speak(item){
  const text=speechText(item);
  if(NOAI) return fallbackSpeak(text);   // iPad：タップと同じ流れで読み上げを開始
  const t=await getTTS();
  if(t){ try{ speaking=true; updSpk(); await t.speak(text,{rate:S.set.rate||1}); }catch(e){ if(e&&e.code!=="viewer_stopped") fallbackSpeak(text); } speaking=false; updSpk(); return; }
  fallbackSpeak(text);
}
function fallbackSpeak(text){
  try{ const ss=window.speechSynthesis; if(!ss) return info("この端末では音声読み上げを使えません。");
    ss.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=S.set.rate||1;
    const vs=(ss.getVoices()||[]).filter(v=>/^ja/i.test(v.lang)); if(vs.length) u.voice=vs.find(v=>/Enhanced|拡張|Premium/i.test(v.name))||vs.find(v=>/Kyoko|O-ren|Hattori/i.test(v.name))||vs[0];
    u.onend=u.onerror=()=>{speaking=false;updSpk();}; speaking=true; updSpk(); ss.speak(u);
  }catch(e){ speaking=false; updSpk(); }
}
function stopSpeak(){ try{ if(tts&&tts.stop) tts.stop(); }catch(e){} try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} speaking=false; updSpk(); }
function updSpk(){ const b=document.getElementById("spk"); if(b){ b.textContent=speaking?"■ 停止":"🔊 音声で解説"; b.classList.toggle("on",speaking); } }

function startQuiz(ids,title,opt){
  stopSpeak(); opt=opt||{}; ids=[...new Set(ids)].filter(id=>byId(id));
  if(!opt.again) ids=ids.filter(id=>!seenToday(byId(id)));
  if(!ids.length) return info("今日解く分は終わりました！<br>正解した問題は、忘れかけた頃（1日後→3日後→7日後…）にまた出題します。");
  Q=Object.assign({title,queue:ids.slice(),pos:0,uniq:new Set(ids),log:[],answered:false,order:null,sel:[],ans:{}},opt||{});
  if(Q.exam){ Q.start=Date.now(); Q.limit=ids.length*80*1000; startTimer(); }
  render(); window.scrollTo(0,0);
}
function startTimer(){ stopTimer(); timerH=setInterval(()=>{ const el=document.getElementById("tm"); if(!Q||!Q.exam) return stopTimer();
  const left=Math.max(0,Q.limit-(Date.now()-Q.start)); if(el) el.textContent=fmt(left); if(left<=0){ stopTimer(); Q.pos=Q.queue.length; renderMockResult(); } },1000); }
function stopTimer(){ if(timerH){clearInterval(timerH);timerH=null;} }
function fmt(ms){ const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startMock(){
  const all=allQ();
  const pick=(f,n)=>shuffle(all.filter(x=>f(x)&&fresh(x))).slice(0,n);   // 今日出してよい問題だけ（正解済みの問題は復習日まで出さない）
  const hs=pick(x=>x.h&&!x.cs,10), gs=pick(x=>!x.h&&!x.cs,15);
  const cases=[...new Set(all.filter(x=>x.cs).map(x=>x.cs))].filter(c=>all.filter(x=>x.cs===c).every(fresh)); const cs=shuffle(cases).slice(0,2);
  const cq=all.filter(x=>cs.includes(x.cs));
  if(hs.length+gs.length+cq.length<5) return info("今日はミニ模試に使える問題が残っていません。<br>正解した問題は復習日まで出さないため、明日以降にまた受けられます。");
  confirmBox(`ミニ模試を始めます。<br>必修${hs.length}問・一般${gs.length}問・状況設定${cq.length}問（制限時間 ${Math.round((hs.length+gs.length+cq.length)*80/60)}分）。<br><small>本番と同じく1問80秒の目安です。1問ごとに正解と説明を表示し、最後に判定します。</small>`,()=>{
    startQuiz(hs.map(x=>x.id).concat(gs.map(x=>x.id),cq.map(x=>x.id)),"ミニ模試",{exam:true});
  },"始める");
}
function renderQuiz(){
  if(Q.pos>=Q.queue.length) return Q.exam?renderMockResult():renderResult();
  const id=Q.queue[Q.pos], item=byId(id); if(!item){ Q.pos++; return renderQuiz(); }
  if(!Q.order) Q.order=item.type==="kako"?item.c.map((_,i)=>i):shuffle(item.c.map((_,i)=>i)); // 過去問は原文の順
  const multi=item.a.length>1;
  const remainUniq=Q.drill?Math.max(0,Q.queue.length-Q.pos):Q.queue.length-Q.pos;
  const pct=Q.pos/Q.queue.length*100;
  app.innerHTML=`
  <div class="qhead">${tagPills(item)}<span>${CATS[item.cat]||""}</span>
  ${Q.exam?`<span class="timer" id="tm">${fmt(Math.max(0,Q.limit-(Date.now()-Q.start)))}</span>`:""}<button class="x" id="quit">終了 ✕</button></div>
  <div class="prog"><i style="width:${pct}%"></i></div>
  <div class="note" style="margin-top:-6px;margin-bottom:6px">${esc(Q.title)}・${Q.pos+1} / ${Q.queue.length}問</div>
  ${item.ct?`<div class="case"><b>状況設定</b>${esc(item.ct)}</div>`:""}
  <div class="qtext">${esc(item.q)}${multi&&!/選べ/.test(item.q)?`（${item.a.length}つ選べ）`:""}</div>
  ${item.fig?`<p class="note" style="margin-top:-8px;margin-bottom:10px">※この問題は図・写真を使います。<a class="lnk" href="${(KAKO_EXAMS.find(e=>e.n===item.exam)||{}).url||"#"}" target="_blank" rel="noopener">厚労省の別冊PDF↗</a></p>`:""}
  <div id="chs">${Q.order.map((oi,k)=>`<button class="ch" data-i="${oi}"><span class="n">${item.type==="kako"?oi+1:k+1}</span><span>${esc(item.c[oi])}</span></button>`).join("")}</div>
  ${multi?`<div class="actions"><button class="act" id="decide" disabled>解答する（${item.a.length}つ選択）</button></div>`:""}
  <div id="after"></div>`;
  bind("quit",()=>{ stopTimer(); stopSpeak(); if(Q.log.length||Object.keys(Q.ans).length) (Q.exam?renderMockResult():renderResult()); else { Q=null; render(); } });
  Q.sel=[];
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    if(Q.answered) return; const i=+b.dataset.i;
    if(!multi) return submit(item,[i]);
    if(Q.sel.includes(i)) Q.sel=Q.sel.filter(x=>x!==i); else if(Q.sel.length<item.a.length) Q.sel.push(i);
    app.querySelectorAll(".ch").forEach(x=>x.classList.toggle("sel",Q.sel.includes(+x.dataset.i)));
    document.getElementById("decide").disabled=Q.sel.length!==item.a.length;
  });
  bind("decide",()=>submit(item,Q.sel.slice()));
}
function record(item,ok){
  const s=st(item.id), now=Date.now(); s.n++; s.t=now;
  if(ok){ s.c++; s.s++; s.b=Math.min(s.b+1,IVL.length-1); s.d=now+IVL[s.b]*DAY; } else { s.w++; s.s=0; s.b=0; s.d=now; }
  S.days[today()]=(S.days[today()]||0)+1; return s;
}
function submit(item,chosen){
  if(Q.answered) return; Q.answered=true;
  const ok=sameSet(chosen,item.a);
  if(Q.exam) Q.ans[item.id]={chosen,ok};
  const s=record(item,ok); Q.log.push({id:item.id,ok});

  save();
  app.querySelectorAll(".ch").forEach(b=>{ b.disabled=true; const bi=+b.dataset.i; b.classList.remove("sel"); if(item.a.includes(bi)) b.classList.add("ok"); else if(chosen.includes(bi)) b.classList.add("ng"); });
  const dc=document.getElementById("decide"); if(dc) dc.remove();
  const left=Math.max(0,MASTER-s.s), fx=S.fx[item.id];
  document.getElementById("after").innerHTML=`
  <div class="res ${ok?"ok":"ng"}"><h3 style="font-size:${ok?18:22}px">${ok?"○ 正解":"✕ 間違い"}</h3>
  ${ok?`<div class="vs" style="grid-template-columns:1fr"><div class="c"><small>○ 正解</small>${item.a.map(i=>esc(item.c[i])).join("<br>")}</div></div>`:vsHTML(item,chosen)}
  <div style="margin-top:10px;font-size:12px;font-weight:700;color:var(--main2)">正解の説明</div>
  <p style="margin-top:2px">${esc(item.e||"")}</p>
  ${figHTML(item.d)}
  ${!ok?`<div id="aifig">${fx?fxHTML(item,fx):""}</div>`:""}
  ${item.p?`<div class="point"><b>覚えるポイント</b>${esc(item.p)}</div>`:""}
  <div class="streak">${[0,1,2].map(k=>`<i class="${k<s.s?"on":""}"></i>`).join("")}<span>${!left?`マスター！（${IVL[s.b]}日後に確認で出題）`:ok?`次は${IVL[s.b]}日後に出題（マスターまであと${left}回）`:"明日もう一度出題します（「間違えた問題」からすぐ解き直すこともできます）"}</span></div>
  <div id="aiOut" class="ai-out" style="display:none"></div></div>
  <div class="actions"><button class="act sub" id="spk">🔊 音声で解説</button>${!NOAI&&!ok&&!fx?`<button class="act sub" id="figb">AIで図解</button>`:""}${NOAI?"":`<button class="act sub" id="deep">AIに質問</button>`}<button class="act" id="next">次へ</button></div>`;
  bind("next",()=>{ stopSpeak(); Q.pos++; Q.answered=false; Q.order=null; renderQuiz(); window.scrollTo(0,0); });
  bind("spk",()=>{ if(speaking) stopSpeak(); else speak(item); });
  bind("deep",()=>askAI(item));
  bind("figb",()=>{ document.getElementById("figb").remove(); aiFigure(item,chosen,document.getElementById("aifig")); });
  // 間違えたら：図解がない問題はAI図解を自動生成、設定がONなら読み上げ
  if(!ok){
    if(!NOAI&&!item.d&&!fx){ const fb=document.getElementById("figb"); if(fb) fb.remove(); aiFigure(item,chosen,document.getElementById("aifig")).then(()=>{ if(S.set.auto&&Q&&Q.answered) speak(item); }); }
    else if(S.set.auto) speak(item);
  }
  document.getElementById("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function askAI(item){
  const out=document.getElementById("aiOut"), sample=await getSample(); out.style.display="block";
  if(!sample){ out.textContent="この表示環境ではAI解説を使えません。"; return; }
  out.innerHTML='<span class="spin"></span> 考え中…';
  const prompt=`看護学生向けに、次の国家試験問題をやさしく深掘り解説してください。正解の根拠、誤りの選択肢が誤りの理由、一緒に覚えるべき関連知識、覚え方（語呂合わせがあれば）を、400字程度、見出しなしの短い段落で。
${item.ct?"状況："+item.ct+"\n":""}問題：${item.q}
選択肢：${item.c.map((x,i)=>(i+1)+". "+x).join(" / ")}
正解：${item.a.map(i=>(i+1)+". "+item.c[i]).join("、")}`;
  try{ await sample(prompt,{onText:({text})=>{out.textContent=text;}}); }
  catch(e){ out.textContent=e&&e.code==="rate_limited"?"混み合っています。少し時間をおいてください。":"解説を取得できませんでした。"; }
}
function renderResult(){
  stopSpeak();
  const ok=Q.log.filter(x=>x.ok).length, n=Q.log.length, uniq=[...new Set(Q.log.map(x=>x.id))];
  const ng=uniq.filter(id=>!mastered(id));
  app.innerHTML=`
  <div class="card center"><div class="note">${esc(Q.title)} 結果</div><div class="big">${n?Math.round(ok/n*100):0}%</div><div>${ok} / ${n} 正解</div>
  <p class="note">マスター済み ${uniq.length-ng.length} / ${uniq.length}問</p></div>
  ${ng.length?`<div class="h2">まだ覚えきれていない問題</div><div class="card">${ng.map(id=>{const x=byId(id);return `<div class="list-q">${esc(x.q)}<br><small class="mark ok">正解：${x.a.map(i=>esc(x.c[i])).join("、")}</small>${x.p?`<br><small>${esc(x.p)}</small>`:""}</div>`}).join("")}</div>`:""}
  <div class="actions">${ng.length?`<button class="act" id="again">覚えきれていない問題をもう一度</button>`:""}<button class="act sub" id="home">ホームへ</button></div>`;
  const t=Q.title; bind("again",()=>startQuiz(groupCases(shuffle(ng)),t,{again:true})); bind("home",()=>{Q=null;setTab("home");});
}
function renderMockResult(){
  stopTimer(); stopSpeak();
  const items=Q.queue.map(byId);
  let hn=0,hc=0,gn=0,gc=0;
  items.forEach(x=>{ const r=Q.ans[x.id]; const ok=r&&r.ok; if(x.h){hn++; if(ok)hc++;} else { const w=x.cs||x.sec==="状況設定"?2:1; gn+=w; if(ok) gc+=w; } });
  const hp=hn?Math.round(hc/hn*100):0, gp=gn?Math.round(gc/gn*100):0;
  const j=(hp>=80&&gp>=BORDER.gen*100)?"合格圏":(hp>=80&&gp>=BORDER.genLow*100)?"ボーダー":"要強化";
  if(!Q.saved){ S.mocks.push({t:Date.now(),hp,gp,j}); Q.saved=true; save(); }
  const wrong=items.filter(x=>!(Q.ans[x.id]&&Q.ans[x.id].ok));
  app.innerHTML=`
  <div class="card center"><div class="note">ミニ模試 判定</div>
  <div class="judge ${j==="合格圏"?"ok":j==="ボーダー"?"mid":"ng"}">${j}</div>
  <div class="stats" style="margin-top:8px"><div class="stat"><b class="${hp<80?"bad":""}">${hp}%</b><small>必修 ${hc}/${hn}<br>基準80%</small></div>
  <div class="stat"><b class="${gp<67?"bad":""}">${gp}%</b><small>一般+状況 ${gc}/${gn}点<br>目標67%</small></div>
  <div class="stat"><b>${fmt(Date.now()-Q.start)}</b><small>所要時間</small></div></div>
  <p class="note">必修は8割未満だと他が満点でも不合格。一般+状況の合格基準は直近5回で約59〜67%（148〜167点/250点）でした。</p></div>
  ${wrong.length?`<div class="h2">間違えた・未解答の問題（図解つき）</div>${wrong.map(x=>{const r=Q.ans[x.id];return `<div class="card">${tagPills(x)}${x.ct?`<div class="case" style="margin-top:6px">${esc(x.ct)}</div>`:""}<div style="margin:6px 0;font-weight:500">${esc(x.q)}</div>${vsHTML(x,r?r.chosen:[])}<p class="note" style="color:var(--ink);font-size:13.5px">${esc(x.e)}</p>${figHTML(x.d||(S.fx[x.id]&&S.fx[x.id].d))}${x.p?`<div class="point"><b>覚えるポイント</b>${esc(x.p)}</div>`:""}</div>`}).join("")}`:""}
  <div class="actions">${wrong.length?`<button class="act" id="again">間違えた問題を習得するまで解く</button>`:""}<button class="act sub" id="home">ホームへ</button></div>`;
  bind("again",()=>startQuiz(groupCases(wrong.map(x=>x.id)),"模試の復習",{again:true}));
  bind("home",()=>{Q=null;setTab("home");});
}

/* ============ 進捗の送信（アプリ版のみ） ============ */
const CFG = window.APP_CONFIG||{};
const CAN_SYNC = BUILD==="pwa" && !!CFG.gasUrl;
let syncT=null, syncPending=false;
function uid(){ return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function buildSummary(){
  const all=allQ(), pr=v=>v===null?null:Math.round(v*100);
  const cats={}; Object.keys(CATS).forEach(k=>{const s=catStat(k); cats[k]={r:s.rate,m:s.m,t:s.total,n:s.n};});
  const krg={}; ["必修"].concat(Object.keys(KR_BIG)).forEach(g=>{ const rec=KR.filter(x=>x.g===g&&S.kr[x.id]); const c=rec.reduce((a,x)=>a+S.kr[x.id].c,0), n=rec.reduce((a,x)=>a+S.kr[x.id].n,0); krg[g]={c,n,rows:rec.length,r:n?Math.round(c/n*100):null}; });
  const krRows={}; Object.keys(S.kr).forEach(k=>{krRows[k]=[S.kr[k].c,S.kr[k].n];});
  const ds=Object.keys(S.days).sort((a,b)=>new Date(a)-new Date(b));
  const now=new Date(); let last7=0; for(let i=0;i<7;i++){ const d=new Date(now-i*DAY); last7+=S.days[d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()]||0; }
  const qs=Object.values(S.q), m=S.mocks[S.mocks.length-1]||null;
  return { v:1, uid:S.profile.uid, name:S.profile.name, group:S.profile.group||"", t:Date.now(),
    answered:qs.reduce((a,x)=>a+(x.n||0),0), tried:all.filter(x=>S.q[x.id]&&S.q[x.id].n>0).length,
    mastered:all.filter(x=>mastered(x.id)).length, totalQ:all.length,
    days:ds.length, lastDay:ds[ds.length-1]||null, last7,
    hissu:pr(rateOf(all.filter(x=>x.h))), gen:pr(rateOf(all.filter(x=>!x.h))),
    lv:[1,2,3].map(l=>{const s=lvStat(l);return [s.m,s.total];}), level:curLevel(),
    mock:m?{hp:m.hp,gp:m.gp,j:m.j,t:m.t}:null, mockCount:S.mocks.length,
    cats, krg, krRows, weak:S.weak.slice(), wrong:wrongList().length,
    today:S.days[today()]||0, avg:avgScore(), pred:passPred(),
    mockAvg:S.mocks.length?{hp:Math.round(S.mocks.reduce((a,m)=>a+m.hp,0)/S.mocks.length),gp:Math.round(S.mocks.reduce((a,m)=>a+m.gp,0)/S.mocks.length)}:null,
    krDone:Object.keys(S.kr||{}).length, krTotal:KR.length };
}
function scheduleSync(){ if(!CAN_SYNC||!S.profile||!S.profile.name) return; syncPending=true; clearTimeout(syncT); syncT=setTimeout(syncNow,10000); }
function syncNow(){
  if(!CAN_SYNC||!S.profile||!S.profile.name) return; clearTimeout(syncT); syncPending=false;
  const body=JSON.stringify({type:"progress",data:buildSummary()});
  try{ fetch(CFG.gasUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body})
    .then(()=>{ S.lastSync=Date.now(); try{localStorage.setItem("kokushi_v1",JSON.stringify(S));}catch(e){} setSync("送信 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})); })
    .catch(()=>{ setSync("未送信（オフライン）"); syncPending=true; }); }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&syncPending&&CAN_SYNC){
  clearTimeout(syncT); syncPending=false;
  try{ navigator.sendBeacon(CFG.gasUrl,new Blob([JSON.stringify({type:"progress",data:buildSummary()})],{type:"text/plain;charset=utf-8"})); }catch(e){} } });
window.addEventListener("online",()=>{ if(syncPending) syncNow(); });
function showRegister(edit){
  const p=S.profile||{}, m=document.getElementById("modal");
  document.getElementById("modalBody").innerHTML=`<b>${edit?"利用者情報の変更":"はじめに利用者登録をしてください"}</b>
  <p class="note">管理者が学習の進み具合を確認するために使います。</p>
  <label style="display:block;font-size:13px;margin-top:10px">お名前（ニックネーム可）<input id="pName" value="${esc(p.name||"")}" maxlength="30" style="width:100%;font:inherit;padding:9px;border:1.5px solid var(--line);border-radius:10px"></label>
  <label style="display:block;font-size:13px;margin-top:8px">所属・学年など（任意）<input id="pGroup" value="${esc(p.group||"")}" maxlength="30" style="width:100%;font:inherit;padding:9px;border:1.5px solid var(--line);border-radius:10px"></label>
  <p class="note" style="background:var(--warnbg);padding:8px 10px;border-radius:8px">登録すると、<b>解答数・平均点・合格予測率・分野別の正答率・過去問の記録・模試の結果</b>が管理者に送られ、<b>毎日、管理者にメールで報告</b>されます。問題ごとの解答内容は送りません。</p>
  <p id="pErr" class="note" style="color:var(--ng)"></p>
  <div class="actions">${edit?'<button class="act sub" id="mNo">やめる</button>':""}<button class="act" id="mYes">${edit?"保存する":"同意して始める"}</button></div>`;
  m.classList.add("on");
  bind("mNo",()=>m.classList.remove("on"));
  bind("mYes",()=>{ const name=document.getElementById("pName").value.trim(), group=document.getElementById("pGroup").value.trim();
    if(!name){ document.getElementById("pErr").textContent="お名前を入力してください。"; return; }
    S.profile={uid:p.uid||uid(),name,group}; save(); syncNow(); m.classList.remove("on"); render(); });
}
function ensureProfile(){ if(CAN_SYNC&&(!S.profile||!S.profile.name)) showRegister(false); }

/* ============ ダイアログ ============ */
function info(html){ const m=document.getElementById("modal"); document.getElementById("modalBody").innerHTML=`<p>${html}</p><div class="actions"><button class="act" id="mOk">OK</button></div>`; m.classList.add("on"); bind("mOk",()=>m.classList.remove("on")); }
function confirmBox(t,fn,yes){ const m=document.getElementById("modal"); document.getElementById("modalBody").innerHTML=`<p>${t}</p><div class="actions"><button class="act sub" id="mNo">やめる</button><button class="act" id="mYes" ${yes?"":'style="background:var(--ng)"'}>${yes||"消去する"}</button></div>`; m.classList.add("on"); bind("mNo",()=>m.classList.remove("on")); bind("mYes",()=>{m.classList.remove("on");fn();}); }

try{ if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); } }catch(e){}
loadLocal(); reindex(); render(); loadKako(); ensureProfile();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
if(typeof CAN_SYNC!=="undefined"&&CAN_SYNC&&S.profile&&S.profile.name) setTimeout(syncNow,3000);   // 起動時にも最新の状況を送る
</script>
